[project]
name = "element2vec-local-cpu-environment"
version = "0.1.0"
description = "Windows CPU preparation, scientific checks and local analysis; not a project package"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "PyYAML>=6,<7",
    "Pillow>=10,<13",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
analysis = [
    "xgboost>=2,<4",
    "umap-learn>=0.5.5,<1",
    "plotly>=5.20,<7",
    "shap>=0.45,<1",
    "hdbscan>=0.8.33,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
