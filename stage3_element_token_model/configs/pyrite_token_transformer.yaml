processed_dir: asset://pyrite_processed
sample_id_col: sample_id
label_col: type
element_columns: [As, Ni, Cu, Pb, Co, Au, Ag, Bi, Sb, Zn, Se, Te, Tl, Mn]

element_embedding_dim: 32
deposit_embedding_dim: 32
d_model: 64
n_heads: 4
n_layers: 2
dim_feedforward: 128
dropout: 0.1
batch_size: 128
learning_rate: 1e-3
min_learning_rate: 1e-5
lr_scheduler: cosine
epochs: 1000
element_mask_ratio: 0.15
deposit_mask_prob: 0.5
joint_mask_prob: 0.2
lambda_elem: 1.0
lambda_type: 1.0
eps: 1e-9
random_seed: 42
loss: huber

pca_dim: 12
knn_k: 15
cv_splits: 5
xgb_n_estimators: 150
xgb_max_depth: 3
xgb_learning_rate: 0.05
umap_n_neighbors: 30
umap_min_dist: 0.1
