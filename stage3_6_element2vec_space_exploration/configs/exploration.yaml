project:
  name: Element2Vec V2 breadth-first representation audit
  root_dir: stage3_6_element2vec_space_exploration
  audit_dir: stage3_6_element2vec_space_exploration/audit
  cache_dir: stage3_6_element2vec_space_exploration/cache
  results_dir: stage3_6_element2vec_space_exploration/results
  reports_dir: stage3_6_element2vec_space_exploration/reports

source:
  model_config: stage3_5_element2vec_v2/configs/v2_base.yaml
  checkpoint: stage3_5_element2vec_v2/outputs/checkpoints/full_model.pt
  stage3_5_outputs: stage3_5_element2vec_v2/outputs
  sqlite_path: legacy_whole_rock_geochem/geochem.db
  view_name: v_high_quality_dataset

sampling:
  seed: 42
  main_samples: 12000
  visible_label_control_samples: 2000
  random_model_control_samples: 3000
  token_reservoir_per_field: 1000
  batch_size: 128
  stratify_by: rock_type

analysis:
  primary_input_mode: numeric_only
  auxiliary_input_modes:
    - masked_labels
  latent_spaces:
    - projected_mean_numeric
    - encoded_mean_numeric
    - cls
  pca_components: 12
  neighbor_k: 15
  permutation_repeats: 199
  probe_folds: 5
  max_pairwise_samples: 3000
  figure_dpi: 180
  status_thresholds:
    strong_effect: 0.30
    moderate_effect: 0.15
    weak_effect: 0.05

runtime:
  device: auto
  max_target_minutes: 10
  num_threads: 8
